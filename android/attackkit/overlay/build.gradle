plugins {
    id 'com.android.application'
}

android {
    namespace 'com.provguard.attackkit.overlay'
    compileSdk 36

    defaultConfig {
        applicationId "com.provguard.attackkit.overlay"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
